name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"   # chạy mỗi 12 giờ
  workflow_dispatch:          # cho phép bấm chạy tay
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#FFB347&color_dots=#12101f,#3b2a5e,#5b3fb0,#7B61FF,#C9B8FF
            dist/snake-light.svg?color_snake=#FF6A1F&color_dots=#ebedf0,#d9ceff,#b7a3ff,#8f77ff,#5b3fb0

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
